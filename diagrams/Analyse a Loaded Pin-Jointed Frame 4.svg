  <title
     id="title">Corrected force diagram for Joint 1</title>
  <desc
     id="description">
    Force diagram for Joint 1. A compressive member force of
    10.392 newtons acts diagonally towards the joint. Member force
    F2 acts horizontally away from the joint. The 9-newton support
    reaction acts vertically upwards towards the joint.
  </desc>
  <defs
     id="defs3">
    <!-- Green arrow for compressive member F1 -->
    <marker
       id="green-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#65e65f"
         id="path1" />
    </marker>
    <!-- Blue arrow for tensile member F2 -->
    <marker
       id="blue-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#087fff"
         id="path2" />
    </marker>
    <!-- Red arrow for support reaction R1 -->
    <marker
       id="red-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#ff2020"
         id="path3" />
    </marker>
    <style
       id="style3">
      .force-line {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
      }

      .green-force {
        stroke: #65e65f;
        marker-end: url(#green-arrow);
      }

      .blue-force {
        stroke: #087fff;
        marker-end: url(#blue-arrow);
      }

      .red-force {
        stroke: #ff2020;
        marker-end: url(#red-arrow);
      }

      .joint {
        fill: #222;
      }

      .force-label {
        font-family: sans-serif;
        font-size: 25px;
        font-weight: bold;
      }

      .green-label {
        fill: #65e65f;
      }

      .blue-label {
        fill: #087fff;
      }

      .red-label {
        fill: #ff2020;
      }
    </style>
  </defs>
  <!--
    Joint centre:
    x = 175
    y = 145
  -->
  <!--
    Corrected compressive force F1.
    The line begins away from the joint and points towards it.
  -->
  <!--
    Tensile force F2.
    The line begins at the joint and points horizontally away.
  -->
  <!--
    Left support reaction R1 = 9 N.
    The arrow points vertically upwards towards the joint.
  -->
  <!-- Joint drawn last so it remains clearly visible -->
  <g
     id="g5">
    <line
       class="force-line green-force"
       x1="154.55859"
       y1="2"
       x2="60.822868"
       y2="80.397156"
       id="line3"
       style="fill:none;fill-opacity:1" />
    <line
       class="force-line blue-force"
       x1="62.527153"
       y1="90.198456"
       x2="201.42645"
       y2="90.198456"
       id="line4" />
    <text
       class="force-label blue-label"
       x="160.52359"
       y="77.416321"
       id="text4"
       style="stroke-width:0.852143">F₂</text>
    <text
       class="force-label blue-label"
       x="32.49477"
       y="93.199722"
       id="text4-4"
       style="font-weight:bold;font-size:25px;font-family:sans-serif;fill:#65e55e;fill-opacity:1;stroke-width:0.852143"
       transform="rotate(-41.075489)">F₂</text>
    <line
       class="force-line red-force"
       x1="52.102497"
       y1="197.71107"
       x2="52.102497"
       y2="102.27104"
       id="line5" />
    <text
       class="force-label red-label"
       x="-1.2695312"
       y="166.74213"
       id="text5"
       style="stroke-width:0.852143">9 N</text>
    <circle
       class="joint"
       cx="52.301437"
       cy="90.198456"
       r="11.077859"
       id="circle5"
       style="stroke-width:0.852143" />
  </g>
  <metadata
     id="metadata5">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Corrected force diagram for Joint 1</dc:title>
      </cc:Work>
