  <title
     id="title">Complete loaded pin-jointed frame</title>
  <desc
     id="description">
    Five-joint, seven-member pin-jointed frame. Downward loads of
    8 newtons and 12 newtons act at the two upper joints. Upward
    support reactions of 9 newtons and 11 newtons terminate at the
    bases of the left and right support triangles.
  </desc>
