  <title
     id="title">Force diagram for Joint 2</title>
  <desc
     id="description">
    Force diagram for Joint 2. A known compressive force of
    10.392 newtons acts diagonally upwards and towards the joint.
    An applied load of 8 newtons acts vertically downwards.
    Unknown member force F3 acts horizontally to the right.
    Unknown member force F4 acts diagonally downwards and to the right.
  </desc>
  <defs
     id="defs4">
    <!-- Purple arrow for the known compressive force F1 -->
    <marker
       id="purple-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#b020d0"
         id="path1" />
    </marker>
    <!-- Blue arrow for the applied 8 N load -->
    <marker
       id="blue-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#087fff"
         id="path2" />
    </marker>
    <!-- Orange arrow for member F3 -->
    <marker
       id="orange-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#ff9d00"
         id="path3" />
    </marker>
    <!-- Light-green arrow for member F4 -->
    <marker
       id="green-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#65e65f"
         id="path4" />
    </marker>
    <style
       id="style4">
      .force-line {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
      }

      .purple-force {
        stroke: #b020d0;
        marker-end: url(#purple-arrow);
      }

      .blue-force {
        stroke: #087fff;
        marker-end: url(#blue-arrow);
      }

      .orange-force {
        stroke: #ff9d00;
        marker-end: url(#orange-arrow);
      }

      .green-force {
        stroke: #65e65f;
        marker-end: url(#green-arrow);
      }

      .joint {
        fill: #222;
      }

      .force-label {
        font-family: sans-serif;
        font-size: 25px;
        font-weight: bold;
      }

      .purple-label {
        fill: #b020d0;
      }

      .blue-label {
        fill: #087fff;
      }

      .orange-label {
        fill: #ff9d00;
      }

      .green-label {
        fill: #65e65f;
      }
    </style>
  </defs>
  <!--
    Joint centre:
    x = 235
    y = 145
  -->
  <!--
    Known compressive member force F1.
    The force acts towards Joint 2 from the lower left.
  -->
  <!--
    Applied load of 8 N.
    The load acts vertically downwards at Joint 2.
  -->
  <!--
    Assumed tensile member force F3.
    The force acts horizontally away from Joint 2.
  -->
  <!--
    Assumed tensile member force F4.
    The force acts diagonally away from Joint 2.
  -->
  <!-- Joint drawn last so the connection remains visible -->
