  <title
     id="title">Corrected force diagram for Joint 5</title>
  <desc
     id="description">
    Force diagram for Joint 5. A compressive member force F5 acts
    diagonally downwards and towards the joint. Member force F6 acts
    horizontally to the left and away from the joint. The right support
    reaction of 11 newtons acts vertically upwards towards the joint.
  </desc>
  <defs
     id="defs3">
    <!-- Green arrow for compressive member F5 -->
    <marker
       id="green-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#65e65f"
         id="path1" />
    </marker>
    <!-- Blue arrow for tensile member F6 -->
    <marker
       id="blue-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#087fff"
         id="path2" />
    </marker>
    <!-- Red arrow for the right support reaction -->
    <marker
       id="red-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#ff2020"
         id="path3" />
    </marker>
    <style
       id="style3">
      .force-line {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
      }

      .green-force {
        stroke: #65e65f;
        marker-end: url(#green-arrow);
      }

      .blue-force {
        stroke: #087fff;
        marker-end: url(#blue-arrow);
      }

      .red-force {
        stroke: #ff2020;
        marker-end: url(#red-arrow);
      }

      .joint {
        fill: #222;
      }

      .force-label {
        font-family: sans-serif;
        font-size: 25px;
        font-weight: bold;
      }

      .green-label {
        fill: #65e65f;
      }

      .blue-label {
        fill: #087fff;
      }

      .red-label {
        fill: #ff2020;
      }
    </style>
  </defs>
  <!--
    Joint centre:
    x = 285
    y = 180
  -->
  <!--
    Corrected compressive member force F5.
    The force begins away from Joint 5 and points towards the joint.
  -->
  <!--
    Corrected tensile member force F6.
    The force begins at Joint 5 and points horizontally away.
  -->
  <!--
    Right support reaction R2 = 11 N.
    The reaction acts vertically upwards towards Joint 5.
  -->
  <!-- Joint drawn last so all force arrows meet clearly -->
  <g
     id="g5"
     transform="matrix(0.64790588,0,0,0.64790588,-65.438494,-34.339012)">
    <line
       class="force-line green-force"
       x1="175"
       y1="55"
       x2="276"
       y2="170"
       id="line3" />
    <text
       class="force-label green-label"
       x="181.9752"
       y="-97.269608"
       transform="rotate(48)"
       id="text3">12.7N</text>
    <line
       class="force-line blue-force"
       x1="272"
       y1="180"
       x2="105"
       y2="180"
       id="line4" />
    <text
       class="force-label blue-label"
       x="143.48637"
       y="175.11284"
       id="text4">F₆</text>
    <line
       class="force-line red-force"
       x1="285"
       y1="305"
       x2="285"
       y2="193"
       id="line5" />
    <text
       class="force-label red-label"
       x="287.18289"
       y="273.94553"
       id="text5">11 N</text>
    <circle
       class="joint"
       cx="285"
       cy="180"
       r="13"
       id="circle5" />
  </g>
  <metadata
     id="metadata5">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Corrected force diagram for Joint 5</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
