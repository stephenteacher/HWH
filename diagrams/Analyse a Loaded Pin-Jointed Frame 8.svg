  <title
     id="title">Force diagram for Joint 4</title>
  <desc
     id="description">
    Force diagram for Joint 4. A known compressive force of
    5.774 newtons acts horizontally from the left towards the joint.
    A 12-newton load acts vertically downwards towards the joint.
    A known compressive force of 12.702 newtons acts diagonally
    upwards from the lower right towards the joint. Unknown member
    force F7 is initially assumed tensile and acts diagonally away
    from the joint towards the lower left.
  </desc>
  <defs
     id="defs4">
    <rect
       x="27.175097"
       y="11.486381"
       width="454.97275"
       height="339.26849"
       id="rect8" />
    <!-- Purple arrow for known compressive member F3 -->
    <marker
       id="purple-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#b020d0"
         id="path1" />
    </marker>
    <!-- Blue arrow for the applied 12 N load -->
    <marker
       id="blue-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#087fff"
         id="path2" />
    </marker>
    <!-- Cyan arrow for known compressive member F5 -->
    <marker
       id="cyan-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#00d8d8"
         id="path3" />
    </marker>
    <!-- Orange arrow for initially assumed tensile member F7 -->
    <marker
       id="orange-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#ff9d00"
         id="path4" />
    </marker>
    <style
       id="style4">
      .force-line {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
      }

      .purple-force {
        stroke: #b020d0;
        marker-end: url(#purple-arrow);
      }

      .blue-force {
        stroke: #087fff;
        marker-end: url(#blue-arrow);
      }

      .cyan-force {
        stroke: #00d8d8;
        marker-end: url(#cyan-arrow);
      }

      .orange-force {
        stroke: #ff9d00;
        marker-end: url(#orange-arrow);
      }

      .joint {
        fill: #222;
      }

      .force-label {
        font-family: sans-serif;
        font-size: 25px;
        font-weight: bold;
      }

      .purple-label {
        fill: #b020d0;
      }

      .blue-label {
        fill: #087fff;
      }

      .cyan-label {
        fill: #00d8d8;
      }

      .orange-label {
        fill: #ff9d00;
      }
    </style>
  </defs>
  <!--
    Joint centre:
    x = 265
    y = 165
  -->
  <!--
    Known compressive member force F3.
    The force acts horizontally towards Joint 4 from the left.
  -->
  <!--
    Applied load of 12 N.
    The load acts vertically downwards towards Joint 4.
  -->
  <!--
    Known compressive member force F5.
    The force begins at the lower right and points towards Joint 4.
  -->
  <!--
    Initially assumed tensile member force F7.
    The force begins at Joint 4 and points away towards the lower left.
  -->
  <!-- Joint drawn last so all arrows meet clearly -->
  <g
