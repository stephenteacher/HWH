     transform="matrix(0.58513825,0,0,0.58513825,-48.566475,-15.213594)">
    <line
       class="force-line purple-force"
       x1="85"
       y1="165"
       x2="252"
       y2="165"
       id="line4" />
    <text
       class="force-label purple-label"
       x="103.36187"
       y="158.44746"
       id="text4">5.774 N</text>
    <line
       class="force-line blue-force"
       x1="265"
       y1="28"
       x2="265"
       y2="152"
       id="line5" />
    <text
       class="force-label blue-label"
       x="269.67316"
       y="88.529182"
       id="text5">12 N</text>
    <line
       class="force-line cyan-force"
       x1="420"
       y1="310"
       x2="275"
       y2="175"
       id="line6" />
    <text
       class="force-label cyan-label"
       x="365.69339"
       y="-68.4589"
       transform="rotate(43)"
       id="text6">12.7 N</text>
    <line
       class="force-line orange-force"
       x1="255"
       y1="175"
       x2="130"
       y2="300"
       id="line7" />
    <text
       class="force-label orange-label"
       x="-66.881989"
       y="299.53174"
       transform="rotate(-43)"
       id="text7">F₇</text>
    <circle
       class="joint"
       cx="265"
       cy="165"
       r="13"
       id="circle7" />
  </g>
  <text
