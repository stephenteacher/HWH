<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 173.66958 151.66157"
   width="173.66959"
   role="img"
   aria-labelledby="title description"
   version="1.1"
   id="svg5"
   sodipodi:docname="Analyse a Loaded Pin-Jointed Frame 6.svg"
   height="151.66158"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <sodipodi:namedview
     id="namedview5"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="3.7794118"
     inkscape:cx="148.83268"
     inkscape:cy="128.19455"
     inkscape:window-width="2560"
     inkscape:window-height="1529"
     inkscape:window-x="1912"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg5" />
  <title
     id="title">Corrected force diagram for Joint 5</title>
  <desc
     id="description">
    Force diagram for Joint 5. A compressive member force F5 acts
    diagonally downwards and towards the joint. Member force F6 acts
    horizontally to the left and away from the joint. The right support
    reaction of 11 newtons acts vertically upwards towards the joint.
  </desc>
  <defs
     id="defs3">
    <!-- Green arrow for compressive member F5 -->
    <marker
       id="green-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#65e65f"
         id="path1" />
    </marker>
    <!-- Blue arrow for tensile member F6 -->
    <marker
       id="blue-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#087fff"
         id="path2" />
    </marker>
    <!-- Red arrow for the right support reaction -->
    <marker
       id="red-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0,0 V 6 L 9,3 Z"
         fill="#ff2020"
         id="path3" />
    </marker>
    <style
       id="style3">
      .force-line {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
      }

      .green-force {
        stroke: #65e65f;
        marker-end: url(#green-arrow);
      }

      .blue-force {
        stroke: #087fff;
        marker-end: url(#blue-arrow);
      }

      .red-force {
        stroke: #ff2020;
        marker-end: url(#red-arrow);
      }

      .joint {
        fill: #222;
      }

      .force-label {
        font-family: sans-serif;
        font-size: 25px;
        font-weight: bold;
      }

      .green-label {
        fill: #65e65f;
      }

      .blue-label {
        fill: #087fff;
      }

      .red-label {
        fill: #ff2020;
      }
    </style>
  </defs>
  <!--
    Joint centre:
    x = 285
    y = 180
  -->
  <!--
    Corrected compressive member force F5.
    The force begins away from Joint 5 and points towards the joint.
  -->
  <line
     class="force-line green-force"
     x1="104.07924"
     y1="70.182381"
     x2="44.010647"
     y2="1.7874535"
     id="line3" />
  <text
     class="force-label green-label"
     x="70.809563"
     y="-33.580395"
     transform="rotate(48)"
     id="text3"
     style="stroke-width:0.594739">F₅</text>
  <!--
    Corrected tensile member force F6.
    The force begins at Joint 5 and points horizontally away.
  -->
  <line
     class="force-line blue-force"
     x1="101.70028"
     y1="76.129745"
     x2="2.3789537"
     y2="76.129745"
     id="line4" />
  <text
     class="force-label blue-label"
     x="40.532471"
     y="74.482094"
     id="text4"
     style="stroke-width:0.594739">F₆</text>
  <!--
    Right support reaction R2 = 11 N.
    The reaction acts vertically upwards towards Joint 5.
  -->
  <line
     class="force-line red-force"
     x1="109.43188"
     y1="150.47209"
     x2="109.43188"
     y2="83.861366"
     id="line5" />
  <text
     class="force-label red-label"
     x="110.73013"
     y="130.74388"
     id="text5"
     style="stroke-width:0.594739">11 N</text>
  <!-- Joint drawn last so all force arrows meet clearly -->
  <circle
     class="joint"
     cx="109.43188"
     cy="76.129745"
     r="7.7315998"
     id="circle5"
     style="stroke-width:0.594739" />
  <metadata
     id="metadata5">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Corrected force diagram for Joint 5</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
